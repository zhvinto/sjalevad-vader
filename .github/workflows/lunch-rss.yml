
name: Uppdatera Själevadskolans lunch-RSS

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lunch:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Starta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skapa dagens RSS
        run: python scripts/update_lunch.py

      - name: Spara uppdaterad RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunch.xml
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera dagens lunch"
            git push
          fi
