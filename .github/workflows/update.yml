
name: Uppdatera väder-RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skapa RSS-flöde
        run: python generate_feed.py

      - name: Spara uppdaterat flöde
        run: |
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "Ingen ändring att spara."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Uppdatera väderprognos"
            git push
          fi
